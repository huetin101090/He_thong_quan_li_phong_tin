[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["vite"]
  included_files = ["src/data/**"]

# 1. Chuyển tiếp toàn bộ API /api và /api/* đến Netlify Function giữ nguyên đường dẫn
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 2. Chuyển tiếp endpoint kiểm tra trạng thái /healthz
[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/api/healthz"
  status = 200
  force = true

# 3. Hỗ trợ Single Page Application (SPA) điều hướng React phía client
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
