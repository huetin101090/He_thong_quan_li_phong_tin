<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var currentFetch = typeof window !== 'undefined' ? window.fetch : undefined;
          var patch = {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          };
          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', patch);
            } catch (e1) {}
          }
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', patch);
            } catch (e2) {}
          }
        } catch (e) {
          console.warn('Fetch setter patch error:', e);
        }
      })();
    </script>
